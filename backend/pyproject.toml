[project]
name = "byte-estoque-backend"
version = "0.1.0"
description = "API de autenticação (login/cadastro) do Byte Estoque"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "sqlalchemy==2.1.8",
    "pymysql==1.2.4",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

# Projeto é uma aplicação (não um pacote instalável): o uv apenas sincroniza
# as dependências na venv backend/.venv.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "-p", "no:cacheprovider"]
markers = [
    "banco: testes que executam SQL direto no MySQL (BDD/FKN/INTG)",
]
